# Postgres. Its first start creates the superuser from db-admin, then the
# init script makes the group role app and the app's login role from the
# Secret the app reads. Later rotations are done in SQL (lab 4 shows how).
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
data:
  # Every TCP connection, 127.0.0.1 included, must give a password
  # (scram-sha-256). Only the local Unix socket is trusted: the init
  # script and an admin who runs kubectl exec use it. The image's own
  # pg_hba.conf also trusts 127.0.0.1, which would let any password
  # through from inside the pod.
  pg_hba.conf: |
    # TYPE  DATABASE  USER  ADDRESS  METHOD
    local   all       all            trust
    host    all       all   all      scram-sha-256
  10-app-role.sh: |
    #!/bin/sh
    # The group role app holds the privileges and cannot log in. The app
    # logs in as a member of it, so a rotation adds a member and retires
    # the old one without touching privileges.
    set -eu
    psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
      --set u="$APP_USER" --set p="$APP_PASSWORD" <<'SQL'
    CREATE ROLE app NOLOGIN;
    GRANT CONNECT, TEMPORARY ON DATABASE app TO app;
    GRANT USAGE, CREATE ON SCHEMA public TO app;
    CREATE ROLE :"u" LOGIN PASSWORD :'p' IN ROLE app;
    SQL
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels: {app: postgres}
spec:
  selector: {app: postgres}
  ports: [{name: postgres, port: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels: {app: postgres}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          env:
            - {name: POSTGRES_DB, value: app}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            # Read once, by the first start (initdb); never again.
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: db-admin, key: username}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: db-admin, key: password}}
            - name: APP_USER
              valueFrom: {secretKeyRef: {name: db-app, key: username}}
            - name: APP_PASSWORD
              valueFrom: {secretKeyRef: {name: db-app, key: password}}
          args: [postgres, -c, hba_file=/etc/postgresql/pg_hba.conf]
          ports: [{name: postgres, containerPort: 5432}]
          readinessProbe:
            exec: {command: [pg_isready, -U, postgres, -h, 127.0.0.1]}
            periodSeconds: 5
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
            - {name: hba, mountPath: /etc/postgresql, readOnly: true}
      volumes:
        - name: init
          configMap: {name: postgres-init, items: [{key: 10-app-role.sh, path: 10-app-role.sh}]}
        - name: hba
          configMap: {name: postgres-init, items: [{key: pg_hba.conf, path: pg_hba.conf}]}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.postgres.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
