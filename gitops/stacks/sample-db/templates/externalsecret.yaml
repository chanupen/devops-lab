# The app's database credentials, from Secrets Manager. ESO checks every
# refreshInterval and updates the Secret; the kubelet then updates the
# mounted files, and the app moves to the new credentials without a restart.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-app
spec:
  refreshInterval: {{ .Values.credentials.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: lab-secrets
  target:
    name: db-app
  data:
    - secretKey: username
      remoteRef: {key: {{ .Values.credentials.key }}, property: username}
    - secretKey: password
      remoteRef: {key: {{ .Values.credentials.key }}, property: password}
