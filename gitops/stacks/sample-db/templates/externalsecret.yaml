# The app's database credentials, from Secrets Manager. ESO checks every
# refreshInterval and updates the Secret; the kubelet then updates the
# mounted files, and the app moves to the new credentials without a restart.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-app
spec:
  refreshInterval: {{ .Values.credentials.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: lab-secrets
  target:
    name: db-app
  data:
    - secretKey: username
      remoteRef: {key: {{ .Values.credentials.key }}, property: username}
    - secretKey: password
      remoteRef: {key: {{ .Values.credentials.key }}, property: password}
---
# Postgres's superuser, read by Postgres at its first start only. Rotations
# use it (over the pod's local socket) to manage the app's roles.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-admin
spec:
  refreshInterval: {{ .Values.credentials.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: lab-secrets
  target:
    name: db-admin
  data:
    - secretKey: username
      remoteRef: {key: {{ .Values.credentials.adminKey }}, property: username}
    - secretKey: password
      remoteRef: {key: {{ .Values.credentials.adminKey }}, property: password}
