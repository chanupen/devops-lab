# The image is set by the sample-db stack when it builds the app (lab up):
# lab-zot:5000/lab/sample-db@sha256:... It is never a tag.
image: ""
postgres:
  image: docker.io/library/postgres:18.6-alpine3.24@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
  storage: 1Gi
  storageClassName: ""   # the cluster's default
credentials:
  key: lab/sample-db/app        # in Secrets Manager: {"username", "password"}
  adminKey: lab/sample-db/admin # Postgres's superuser; never rotated
  refreshInterval: 1m
serviceMonitor:
  enabled: false
