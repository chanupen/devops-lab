# The image is set by the sample-db stack when it builds the app (lab up):
# lab-zot:5000/lab/sample-db@sha256:... It is never a tag.
image: ""
postgres:
  image: docker.io/library/postgres:18.6-alpine3.24@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
  storage: 1Gi
  storageClassName: ""   # the cluster's default
credentials:
  key: lab/sample-db/app        # in Secrets Manager: {"username", "password"}
  adminKey: lab/sample-db/admin # Postgres's superuser; never rotated
  refreshInterval: 1m
serviceMonitor:
  enabled: false
# TLS for in-cluster clients: the app serves HTTPS on 8443 with a
# certificate from cert-manager (a CA of its own in this namespace) and
# reloads it on renewal. issuer and caSecretName name the Issuer the
# certificate uses and the Secret that Issuer signs with.
tls:
  enabled: true
  issuer: sample-db-ca
  caSecretName: sample-db-ca
  duration: 2160h    # 90 days
  renewBefore: 720h  # renew with 30 days left
# A small client that calls /api/check twice a second, so the latency SLO
# (obs stack, lab-slo-sample-db) has traffic to measure.
client:
  enabled: true
  image: docker.io/curlimages/curl:8.17.0@sha256:935d9100e9ba842cdb060de42472c7ca90cfe9a7c96e4dacb55e79e560b3ff40
