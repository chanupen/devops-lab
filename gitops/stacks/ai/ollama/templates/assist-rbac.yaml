apiVersion: v1
kind: ServiceAccount
metadata:
  name: assist-tools
  namespace: ai
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: assist-trace
  namespace: ai
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lab-assist-trace
  namespace: ai
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["langfuse-credentials"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lab-assist-trace
  namespace: ai
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: lab-assist-trace
subjects:
  - kind: ServiceAccount
    name: assist-trace
    namespace: ai
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: lab-assist-pods-events
rules:
  - apiGroups: [""]
    resources: ["pods", "events", "nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: lab-assist-pods-events
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: lab-assist-pods-events
subjects:
  - kind: ServiceAccount
    name: assist-tools
    namespace: ai
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lab-assist-history
  namespace: argocd
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lab-assist-history
  namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: lab-assist-history
subjects:
  - kind: ServiceAccount
    name: assist-tools
    namespace: ai
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lab-assist-query
  namespace: monitoring
rules:
  - apiGroups: [""]
    resources: ["services/proxy"]
    resourceNames: ["loki:3100", "kps-prometheus:9090"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lab-assist-query
  namespace: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: lab-assist-query
subjects:
  - kind: ServiceAccount
    name: assist-tools
    namespace: ai
