# Langfuse's credentials, from Secrets Manager through ESO: Moto locally
# (lab up creates them with random values the first time), AWS in cloud.
# Each Secret is one Secrets Manager secret read whole (dataFrom.extract),
# with the key names the chart expects, so lab up can put a secret Moto
# lost back from its Secret. Nothing is in Git and nothing is generated by
# the chart.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: langfuse-credentials # not langfuse-app: the chart renders an (empty) Secret of that name
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: lab-secrets}
  target: {name: langfuse-credentials}
  dataFrom:
    - extract: {key: lab/ai/langfuse-app} # salt, encryption-key, nextauth-secret, public-key, secret-key, admin-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: langfuse-postgresql-auth
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: lab-secrets}
  target: {name: langfuse-postgresql-auth}
  dataFrom:
    - extract: {key: lab/ai/langfuse-postgresql} # POSTGRES_USER/PASSWORD/DB, USERDB_USER/PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: langfuse-redis-auth
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: lab-secrets}
  target: {name: langfuse-redis-auth}
  dataFrom:
    - extract: {key: lab/ai/langfuse-redis} # default (the Valkey user's password)
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: langfuse-clickhouse-auth
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: lab-secrets}
  target: {name: langfuse-clickhouse-auth}
  dataFrom:
    - extract: {key: lab/ai/langfuse-clickhouse} # password
