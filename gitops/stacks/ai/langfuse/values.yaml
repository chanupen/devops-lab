# Langfuse v4 (chart 2.2.3, app 4.75.0), self-hosted: LLM traces over
# OTLP (/api/public/otel/v1/traces). Web and worker, Postgres, Valkey,
# ClickHouse and Keeper (one each, through the ClickHouse operator) and S3
# for raw events (Moto locally, set in the overlay). Every credential comes
# from Secrets Manager through ESO (gitops/stacks/ai/secrets); nothing is
# generated by the chart, whose lookup-based generation would rotate them
# on every Argo CD sync. Images by digest, pulled from docker.io (the same
# digests docker.langfuse.com serves), so the local Zot cache holds them.
# Memory measured on the local lab: about 1.8 GiB for the whole stack.
langfuse:
  features:
    telemetryEnabled: false
    signUpDisabled: true
  logging:
    level: warn
  salt:
    secretKeyRef: {name: langfuse-credentials, key: salt}
  encryptionKey:
    secretKeyRef: {name: langfuse-credentials, key: encryption-key}
  nextauth:
    url: https://langfuse.localtest.me:8443
    secret:
      secretKeyRef: {name: langfuse-credentials, key: nextauth-secret}
  # Headless init: the lab organisation and project, the API keys the smoke
  # test and the assistant use, and the UI login (admin@lab.local).
  additionalEnv:
    - {name: LANGFUSE_INIT_ORG_ID, value: lab}
    - {name: LANGFUSE_INIT_ORG_NAME, value: lab}
    - {name: LANGFUSE_INIT_PROJECT_ID, value: lab}
    - {name: LANGFUSE_INIT_PROJECT_NAME, value: lab}
    - name: LANGFUSE_INIT_PROJECT_PUBLIC_KEY
      valueFrom: {secretKeyRef: {name: langfuse-credentials, key: public-key}}
    - name: LANGFUSE_INIT_PROJECT_SECRET_KEY
      valueFrom: {secretKeyRef: {name: langfuse-credentials, key: secret-key}}
    - {name: LANGFUSE_INIT_USER_EMAIL, value: admin@lab.local}
    - {name: LANGFUSE_INIT_USER_NAME, value: admin}
    - name: LANGFUSE_INIT_USER_PASSWORD
      valueFrom: {secretKeyRef: {name: langfuse-credentials, key: admin-password}}
  web:
    image:
      repository: docker.io/langfuse/langfuse
      tag: "4.75.0@sha256:23378ae8cdf1d92b647d68b81c0d0cea3632b43e9fbcbe9b765420af9c9c8662"
    resources:
      requests: {cpu: 100m, memory: 768Mi}
      limits: {memory: 1536Mi}
  worker:
    image:
      repository: docker.io/langfuse/langfuse-worker
      tag: "4.75.0@sha256:5fd09700a8af5328f3ef004ca8ce5602f6e799aba13da5054d9b18ba1724533e"
    resources:
      requests: {cpu: 100m, memory: 640Mi}
      limits: {memory: 1280Mi}

postgresql:
  auth:
    existingSecret: langfuse-postgresql-auth
    secretKeys:
      userPasswordKey: USERDB_PASSWORD
      adminPasswordKey: POSTGRES_PASSWORD
  image:
    repository: library/postgres # the sub-chart adds docker.io/
    tag: "18@sha256:bd5dfa494a5a259704365813dbfa5fa6b3e69be7348d43b547f540c730478583"
  storage:
    requestedSize: 1Gi
  resources:
    requests: {cpu: 20m, memory: 64Mi}
    limits: {memory: 256Mi}

redis:
  auth:
    existingSecret: langfuse-redis-auth
    existingSecretPasswordKey: default
    usersExistingSecret: langfuse-redis-auth
  image:
    tag: "8.0@sha256:04b9002ae24bbe66687fb025052ed9bcebb54f8da3937338eb718d98d362887f"
  dataStorage:
    requestedSize: 1Gi
  resources:
    requests: {cpu: 10m, memory: 16Mi}
    limits: {memory: 128Mi}

clickhouse:
  # The CRDs come from the clickhouse-operator app (an earlier sync wave);
  # Argo CD renders without the cluster, so the chart cannot check them.
  crdCheck: false
  auth:
    existingSecret: langfuse-clickhouse-auth
    existingSecretKey: password
  cluster:
    replicas: 1
    image:
      repository: docker.io/clickhouse/clickhouse-server
      tag: "26.8.36.3@sha256:d426d2f612e1e189c90f9a3f8dcd85a03c6851273833817a296bb327e63aa7a7"
    storage:
      size: 5Gi
    resources:
      requests: {cpu: 100m, memory: 384Mi}
      limits: {memory: 1536Mi}
    logger: {level: warning}
  keeper:
    replicas: 1 # one Keeper: the CRD needs one even for a single ClickHouse
    image:
      repository: docker.io/clickhouse/clickhouse-keeper
      tag: "26.8.36.3@sha256:a847f2f30ac6950828d6f2413828adeeee4c9d261cb88f88eb6f1606a5f5a062"
    storage:
      size: 1Gi
    resources:
      requests: {cpu: 20m, memory: 160Mi}
      limits: {memory: 512Mi}
    logger: {level: warning}

s3:
  deploy: false # no SeaweedFS: Moto's S3 locally, AWS S3 in cloud (overlays)
  bucket: lab-langfuse
  region: ap-south-1
