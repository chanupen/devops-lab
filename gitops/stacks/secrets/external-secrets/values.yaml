# External Secrets Operator for the lab: one replica each of the controller,
# the webhook and the cert controller.
installCRDs: true
replicaCount: 1
webhook:
  replicaCount: 1
certController:
  replicaCount: 1
# The controller's metrics (ExternalSecret sync status) as a Service; the
# obs stack scrapes it (additionalServiceMonitors), so this stack does not
# need the ServiceMonitor CRD.
metrics:
  service:
    enabled: true
