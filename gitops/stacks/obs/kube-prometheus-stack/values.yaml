# kube-prometheus-stack for the lab: one small Prometheus with a day of data,
# Alertmanager, node-exporter, kube-state-metrics and Grafana.
fullnameOverride: kps

prometheus:
  prometheusSpec:
    retention: 24h
    resources:
      requests: {cpu: 100m, memory: 384Mi}
      limits: {memory: 1Gi}
    # Pick up ServiceMonitors and rules from every release, not only this one.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false

alertmanager:
  enabled: true
  alertmanagerSpec:
    resources:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {memory: 128Mi}

prometheusOperator:
  resources:
    requests: {cpu: 20m, memory: 64Mi}
    limits: {memory: 256Mi}

kubeStateMetrics:
  enabled: true
kube-state-metrics:
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 128Mi}

nodeExporter:
  enabled: true
prometheus-node-exporter:
  resources:
    requests: {cpu: 10m, memory: 16Mi}
    limits: {memory: 64Mi}

grafana:
  enabled: true
  # The admin login comes from a Secret the obs stack generates in the
  # cluster; it is never in Git.
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  resources:
    requests: {cpu: 20m, memory: 128Mi}
    limits: {memory: 384Mi}
  additionalDataSources:
    - name: Loki
      type: loki
      uid: loki
      url: http://loki.monitoring.svc:3100
      access: proxy
