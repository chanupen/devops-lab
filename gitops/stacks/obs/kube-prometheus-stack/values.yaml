# kube-prometheus-stack for the lab: one small Prometheus with a day of data,
# Alertmanager, node-exporter, kube-state-metrics and Grafana.
fullnameOverride: kps

prometheus:
  prometheusSpec:
    retention: 24h
    resources:
      requests: {cpu: 100m, memory: 384Mi}
      limits: {memory: 1Gi}
    # Pick up ServiceMonitors and rules from every release, not only this one.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
  # Components whose charts would need the ServiceMonitor CRD before obs
  # exists (core, secrets): obs scrapes them itself. A missing target is
  # harmless while its stack is down. honorLabels keeps their namespace
  # label (the Certificate's, the ExternalSecret's) instead of renaming it
  # exported_namespace.
  additionalServiceMonitors:
    - name: cert-manager
      namespaceSelector: {matchNames: [cert-manager]}
      selector:
        matchLabels: {app.kubernetes.io/name: cert-manager, app.kubernetes.io/component: controller}
      endpoints: [{port: http-metrics, interval: 30s, honorLabels: true}]
    - name: external-secrets
      namespaceSelector: {matchNames: [external-secrets]}
      selector:
        matchLabels: {app.kubernetes.io/name: external-secrets}
      endpoints: [{port: metrics, interval: 30s, honorLabels: true}]

alertmanager:
  enabled: true
  alertmanagerSpec:
    resources:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {memory: 128Mi}

prometheusOperator:
  resources:
    requests: {cpu: 20m, memory: 64Mi}
    limits: {memory: 256Mi}

kubeStateMetrics:
  enabled: true
kube-state-metrics:
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 128Mi}

nodeExporter:
  enabled: true
prometheus-node-exporter:
  # One pod per node: it must win a full node's last pod slot, or the app
  # never turns Healthy.
  priorityClassName: system-node-critical
  resources:
    requests: {cpu: 10m, memory: 16Mi}
    limits: {memory: 64Mi}

grafana:
  enabled: true
  # The admin login comes from a Secret the obs stack generates in the
  # cluster; it is never in Git.
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  resources:
    requests: {cpu: 20m, memory: 128Mi}
    limits: {memory: 384Mi}
  additionalDataSources:
    - name: Loki
      type: loki
      uid: loki
      url: http://loki.monitoring.svc:3100
      access: proxy

# KubePodCrashLooping waits 15 minutes upstream; most crash loops are
# fixed sooner than that, so the lab's alert would rarely fire. 5 minutes
# is still long enough to skip a pod that restarts once.
# KubeNodeNotReady waits 15 minutes upstream, longer than a node-loss
# drill; 2 minutes still skips a kubelet restart.
customRules:
  KubePodCrashLooping:
    for: 5m
  KubeNodeNotReady:
    for: 2m

# Alerts kube-prometheus-stack does not have, for faults the drills
# (drills/) inject. Each drill names the alert that should catch it.
additionalPrometheusRulesMap:
  lab-drills:
    groups:
      - name: lab-drills
        rules:
          # oom: a container restarted in the last 10 minutes and its last
          # termination was an OOM kill. increase(), not "offset 10m": a
          # pod younger than 10 minutes (a new release) has no older sample.
          - alert: KubeContainerOOMKilled
            expr: |
              increase(kube_pod_container_status_restarts_total{job="kube-state-metrics"}[10m]) > 0
              and on (namespace, pod, container)
              max_over_time(kube_pod_container_status_last_terminated_reason{job="kube-state-metrics", reason="OOMKilled"}[10m]) == 1
            labels:
              severity: warning
            annotations:
              summary: Container {{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }} was OOMKilled.
              description: Its memory limit is below what it needs; compare the limit with container_memory_working_set_bytes.
          # dns: CoreDNS is scraped as job coredns. With every replica gone
          # its targets disappear, so up == 0 never shows; absent() does.
          - alert: CoreDNSDown
            expr: absent(up{job="coredns"} == 1)
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: No CoreDNS instance is up.
              description: Service discovery by name fails across the cluster; check the coredns Deployment in kube-system.
          # cert-expiry: cert-manager renews a certificate at its renewal
          # time. Still not renewed two minutes later means issuance fails,
          # and the certificate runs out at its expiry time.
          - alert: CertificateExpiringSoon
            expr: |
              time() - max by (namespace, name) (certmanager_certificate_renewal_timestamp_seconds) > 120
              and on (namespace, name)
              max by (namespace, name) (certmanager_certificate_expiration_timestamp_seconds) > time()
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: Certificate {{ $labels.namespace }}/{{ $labels.name }} is past its renewal time and was not renewed.
              description: cert-manager cannot issue it again; it expires at its notAfter. kubectl describe certificate, then its CertificateRequest and Issuer.
          - alert: CertificateNotReady
            expr: max by (namespace, name) (certmanager_certificate_ready_status{condition="False"}) == 1
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: Certificate {{ $labels.namespace }}/{{ $labels.name }} is not Ready.
              description: Its Secret is missing, expired or does not match the spec; kubectl describe certificate.
          # secret-drift: ESO cannot read an ExternalSecret's remote secret.
          - alert: ExternalSecretSyncFailed
            expr: max by (namespace, name) (externalsecret_status_condition{condition="Ready", status="False"}) == 1
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: ExternalSecret {{ $labels.namespace }}/{{ $labels.name }} cannot sync.
              description: Its Kubernetes Secret keeps the last values it synced; kubectl describe externalsecret shows the provider's error.
  # slow-db: sample-db's latency SLO, the pattern of lab 3 (SRE workbook
  # multiwindow, multi-burn-rate). 99% of /api/check requests answer
  # within 250 ms, over 30 days.
  lab-slo-sample-db:
    groups:
      - name: lab-slo-sample-db
        rules:
          - record: sampledb:slo:objective_ratio
            expr: vector(0.99)
          - record: sampledb:sli_latency:error_ratio_rate2m
            expr: |
              1 - (
                sum(rate(sampledb_http_request_duration_seconds_bucket{path="/api/check", le="0.25"}[2m]))
                /
                sum(rate(sampledb_http_request_duration_seconds_count{path="/api/check"}[2m]))
              )
          - record: sampledb:sli_latency:error_ratio_rate10m
            expr: |
              1 - (
                sum(rate(sampledb_http_request_duration_seconds_bucket{path="/api/check", le="0.25"}[10m]))
                /
                sum(rate(sampledb_http_request_duration_seconds_count{path="/api/check"}[10m]))
              )
          - record: sampledb:sli_latency:error_ratio_rate1h
            expr: |
              1 - (
                sum(rate(sampledb_http_request_duration_seconds_bucket{path="/api/check", le="0.25"}[1h]))
                /
                sum(rate(sampledb_http_request_duration_seconds_count{path="/api/check"}[1h]))
              )
          # Burn rate: the error ratio over the error budget (1%).
          - alert: SampleDBLatencyFastBurn
            expr: |
              sampledb:sli_latency:error_ratio_rate10m > 14.4 * 0.01
              and
              sampledb:sli_latency:error_ratio_rate2m > 14.4 * 0.01
            labels:
              severity: page
              slo: sample-db-latency
            annotations:
              summary: sample-db burns its latency error budget 14.4 times too fast.
              description: More than 14.4% of /api/check requests take over 250 ms (10m and 2m windows); at this rate the 30-day budget is gone in about 2 days.
          - alert: SampleDBLatencySlowBurn
            expr: |
              sampledb:sli_latency:error_ratio_rate1h > 6 * 0.01
              and
              sampledb:sli_latency:error_ratio_rate10m > 6 * 0.01
            labels:
              severity: page
              slo: sample-db-latency
            annotations:
              summary: sample-db burns its latency error budget 6 times too fast.
              description: More than 6% of /api/check requests take over 250 ms (1h and 10m windows).
