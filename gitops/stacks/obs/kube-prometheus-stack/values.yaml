# kube-prometheus-stack for the lab: one small Prometheus with a day of data,
# Alertmanager, node-exporter, kube-state-metrics and Grafana.
fullnameOverride: kps

prometheus:
  prometheusSpec:
    retention: 24h
    resources:
      requests: {cpu: 100m, memory: 384Mi}
      limits: {memory: 1Gi}
    # Pick up ServiceMonitors and rules from every release, not only this one.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false

alertmanager:
  enabled: true
  alertmanagerSpec:
    resources:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {memory: 128Mi}

prometheusOperator:
  resources:
    requests: {cpu: 20m, memory: 64Mi}
    limits: {memory: 256Mi}

kubeStateMetrics:
  enabled: true
kube-state-metrics:
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 128Mi}

nodeExporter:
  enabled: true
prometheus-node-exporter:
  resources:
    requests: {cpu: 10m, memory: 16Mi}
    limits: {memory: 64Mi}

grafana:
  enabled: true
  # The admin login comes from a Secret the obs stack generates in the
  # cluster; it is never in Git.
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  resources:
    requests: {cpu: 20m, memory: 128Mi}
    limits: {memory: 384Mi}
  additionalDataSources:
    - name: Loki
      type: loki
      uid: loki
      url: http://loki.monitoring.svc:3100
      access: proxy

# KubePodCrashLooping waits 15 minutes upstream; most crash loops are
# fixed sooner than that, so the lab's alert would rarely fire. 5 minutes
# is still long enough to skip a pod that restarts once.
customRules:
  KubePodCrashLooping:
    for: 5m

# Alerts kube-prometheus-stack does not have, for faults the drills
# (drills/) inject. Each drill names the alert that should catch it.
additionalPrometheusRulesMap:
  lab-drills:
    groups:
      - name: lab-drills
        rules:
          # oom: a container restarted in the last 10 minutes and its last
          # termination was an OOM kill.
          - alert: KubeContainerOOMKilled
            expr: |
              (kube_pod_container_status_restarts_total{job="kube-state-metrics"}
                - kube_pod_container_status_restarts_total{job="kube-state-metrics"} offset 10m >= 1)
              and ignoring (reason)
              min_over_time(kube_pod_container_status_last_terminated_reason{job="kube-state-metrics", reason="OOMKilled"}[10m]) == 1
            labels:
              severity: warning
            annotations:
              summary: Container {{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }} was OOMKilled.
              description: Its memory limit is below what it needs; compare the limit with container_memory_working_set_bytes.
          # dns: CoreDNS is scraped as job coredns. With every replica gone
          # its targets disappear, so up == 0 never shows; absent() does.
          - alert: CoreDNSDown
            expr: absent(up{job="coredns"} == 1)
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: No CoreDNS instance is up.
              description: Service discovery by name fails across the cluster; check the coredns Deployment in kube-system.
