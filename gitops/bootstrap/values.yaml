# Set by the gitops stack on the lab-bootstrap Application; do not edit here.
mode: local          # local | cloud; selects gitops/overlays/<mode>
repo:
  url: ""
  revision: main     # always main; lab-bootstrap passes it to in-repo apps
# Charts published as OCI on a registry the mirror caches are pulled through
# it ("<mirror>/<registry>/<path>"). Empty pulls from the registries directly.
# Set per mode in gitops/overlays/<mode>/bootstrap/values.yaml.
charts:
  ociMirror: ""
stacks:
  ai: false
  core: false
  obs: false
  policy: false
  secrets: false
  sample-app: false
  sample-db: false
# Set by the sample-db stack when it builds the app (lab up): its image by
# digest in the lab registry.
sampleDB:
  image: ""
# Set by the ai stack (lab up, local mode): the Ollama container's address
# on the kind network, for ollama.ai.svc's NetworkPolicy.
ai:
  ollamaAddress: ""
  assistantImage: ""
# Container resources for the core charts (metrics-server, cert-manager),
# whose values live in the templates. Empty keeps the charts' defaults.
# Set per mode in gitops/overlays/<mode>/bootstrap/values.yaml.
resources: {}
