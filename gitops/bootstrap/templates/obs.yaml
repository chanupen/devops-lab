{{- if .Values.stacks.obs }}
# obs: metrics (kube-prometheus-stack with Grafana) and logs (Loki, with the
# OpenTelemetry Collector shipping pod logs).
# Charts come from their Helm repos; values from this repo, base then overlay.
{{- $repo := .Values.repo }}
{{- $mode := .Values.mode }}
{{- range $app := list
      (dict "name" "kube-prometheus-stack" "chart" "kube-prometheus-stack" "wave" "0" "oci" "ghcr.io/prometheus-community/charts" "version" "92.10.1" "release" "kps")
      (dict "name" "loki" "chart" "loki" "wave" "0" "oci" "ghcr.io/grafana/helm-charts" "version" "7.3.0" "release" "loki")
      (dict "name" "otel-collector" "chart" "opentelemetry-collector" "wave" "1" "oci" "ghcr.io/open-telemetry/opentelemetry-helm-charts" "version" "0.176.0" "release" "otel-collector") }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  {{- include "lab.appMeta" (list $ $app.name "obs" $app.wave) | nindent 2 }}
spec:
  project: default
  sources:
    - repoURL: {{ include "lab.ociRepo" (list $ $app.oci) }}
      chart: {{ $app.chart }}
      targetRevision: {{ $app.version }}
      helm:
        releaseName: {{ $app.release }}
        ignoreMissingValueFiles: true # an overlay may have nothing to add
        valueFiles:
          - $values/gitops/stacks/obs/{{ $app.name }}/values.yaml
          - $values/gitops/overlays/{{ $mode }}/obs/{{ $app.name }}/values.yaml
    - repoURL: {{ required "repo.url is required" $repo.url }}
      targetRevision: {{ $repo.revision }}
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    {{- include "lab.syncPolicy" $ | nindent 4 }}
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true # the Prometheus operator CRDs exceed the client-side apply limit
{{- end }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  {{- include "lab.appMeta" (list . "obs-routes" "obs" "1") | nindent 2 }}
spec:
  project: default
  source:
    repoURL: {{ .Values.repo.url }}
    targetRevision: {{ .Values.repo.revision }}
    path: gitops/overlays/{{ .Values.mode }}/obs/routes
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    {{- include "lab.syncPolicy" . | nindent 4 }}
{{- end }}
