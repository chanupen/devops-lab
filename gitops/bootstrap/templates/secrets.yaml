{{- if .Values.stacks.secrets }}
# secrets: External Secrets Operator, then the ClusterSecretStore lab-secrets
# that points it at Secrets Manager: Moto in local mode (the local provider
# runs it beside the cluster), AWS in cloud mode. Only the store differs by
# mode, in gitops/overlays/<mode>/secrets.
{{- $repo := .Values.repo }}
{{- $mode := .Values.mode }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  {{- include "lab.appMeta" (list . "external-secrets" "secrets" "0") | nindent 2 }}
spec:
  project: default
  sources:
    - repoURL: {{ include "lab.ociRepo" (list $ "ghcr.io/external-secrets/charts") }}
      chart: external-secrets
      targetRevision: 2.13.0
      helm:
        releaseName: external-secrets
        ignoreMissingValueFiles: true # an overlay may have nothing to add
        valueFiles:
          - $values/gitops/stacks/secrets/external-secrets/values.yaml
          - $values/gitops/overlays/{{ $mode }}/secrets/external-secrets/values.yaml
    - repoURL: {{ required "repo.url is required" $repo.url }}
      targetRevision: {{ $repo.revision }}
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    {{- include "lab.syncPolicy" . | nindent 4 }}
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true # ESO's CRDs exceed the client-side apply limit
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  {{- include "lab.appMeta" (list . "secrets-store" "secrets" "1") | nindent 2 }}
spec:
  project: default
  source:
    repoURL: {{ $repo.url }}
    targetRevision: {{ $repo.revision }}
    path: gitops/overlays/{{ $mode }}/secrets/store
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    {{- include "lab.syncPolicy" . | nindent 4 }}
    syncOptions:
      - SkipDryRunOnMissingResource=true # the CRDs come from external-secrets
{{- end }}
