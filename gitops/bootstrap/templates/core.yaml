{{- if .Values.stacks.core }}
# core: cluster add-ons. Wave 0 installs the controllers and CRDs; wave 1 adds
# the Gateway, which needs both Envoy Gateway and cert-manager.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  {{- include "lab.appMeta" (list . "metrics-server" "core" "0") | nindent 2 }}
spec:
  project: default
  source:
    repoURL: https://kubernetes-sigs.github.io/metrics-server/
    chart: metrics-server
    targetRevision: 3.14.0
    helm:
      valuesObject:
        args:
          - --kubelet-insecure-tls # kind kubelets serve self-signed certificates
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    {{- include "lab.syncPolicy" . | nindent 4 }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  {{- include "lab.appMeta" (list . "cert-manager" "core" "0") | nindent 2 }}
spec:
  project: default
  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: v1.21.2
    helm:
      valuesObject:
        crds:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    {{- include "lab.syncPolicy" . | nindent 4 }}
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  {{- include "lab.appMeta" (list . "envoy-gateway" "core" "0") | nindent 2 }}
spec:
  project: default
  source:
    repoURL: docker.io/envoyproxy # OCI; registered by the repo-envoyproxy-oci Secret below
    chart: gateway-helm
    targetRevision: v1.9.2
  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-gateway-system
  syncPolicy:
    {{- include "lab.syncPolicy" . | nindent 4 }}
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true # the Gateway API CRDs exceed the client-side apply annotation limit
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  {{- include "lab.appMeta" (list . "core-gateway" "core" "1") | nindent 2 }}
spec:
  project: default
  source:
    repoURL: {{ required "repo.url is required" .Values.repo.url }}
    targetRevision: {{ .Values.repo.revision }}
    path: gitops/overlays/{{ .Values.mode }}/core/gateway
  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-gateway-system
  syncPolicy:
    {{- include "lab.syncPolicy" . | nindent 4 }}
    syncOptions:
      - SkipDryRunOnMissingResource=true
---
# Public OCI Helm repository for Envoy Gateway; no credentials.
apiVersion: v1
kind: Secret
metadata:
  name: repo-envoyproxy-oci
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  type: helm
  name: envoyproxy
  url: docker.io/envoyproxy
  enableOCI: "true"
{{- end }}
