# Cloud mode: ESO reads AWS Secrets Manager in ap-south-1 with EKS Pod
# Identity (the cluster module binds the external-secrets service account
# to a read-only role for lab/* and labNN/* secrets). No endpoint, no keys.
resources:
  requests: {cpu: 10m, memory: 48Mi}
  limits: {memory: 192Mi}
webhook:
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 128Mi}
certController:
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 128Mi}
