# Cloud mode: ESO reads AWS Secrets Manager in ap-south-1 with EKS Pod
# Identity (the cluster module binds the external-secrets service account
# to a read-only role for lab/* and labNN/* secrets). No endpoint, no keys.
# Requests near what each uses on the local lab (kubectl top), so Karpenter
# sizes nodes for them.
resources:
  requests: {cpu: 10m, memory: 48Mi}   # uses 41Mi
  limits: {memory: 192Mi}
webhook:
  resources:
    requests: {cpu: 10m, memory: 48Mi}   # uses 29Mi
    limits: {memory: 128Mi}
certController:
  resources:
    requests: {cpu: 10m, memory: 64Mi}   # uses 60Mi
    limits: {memory: 192Mi}
