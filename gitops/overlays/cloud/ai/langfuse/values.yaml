# Cloud mode: a stub. lab refuses the ai stack in cloud mode until it has a
# GPU node and real S3 (see "AI stack in cloud mode" in docs/design.md).
# What is here keeps the render test's cloud rules: every claim on lab-gp3,
# no Moto. S3 will be a lab-tagged bucket reached with EKS Pod Identity.
postgresql:
  storage: {className: lab-gp3}
redis:
  dataStorage: {className: lab-gp3}
clickhouse:
  cluster:
    storage: {className: lab-gp3}
  keeper:
    storage: {className: lab-gp3}
