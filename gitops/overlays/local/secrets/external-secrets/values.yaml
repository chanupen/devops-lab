# Local mode: Secrets Manager is Moto, the container lab-moto on the kind
# network (the local provider runs it). ESO's AWS provider takes the
# endpoint from the controller's environment; the store and every
# ExternalSecret stay the same as in cloud mode.
extraEnv:
  - name: AWS_SECRETSMANAGER_ENDPOINT
    value: http://lab-moto:5000
resources:
  requests: {cpu: 10m, memory: 48Mi}
  limits: {memory: 192Mi}
webhook:
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 128Mi}
certController:
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 128Mi}
