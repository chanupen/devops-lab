# Local mode: the lab is disposable, so Loki keeps its data in an emptyDir
# instead of a PVC. With persistence off the chart mounts nothing at
# /var/loki (and the root filesystem is read-only), so mount one here.
singleBinary:
  persistence:
    enabled: false
  extraVolumes:
    - name: data
      emptyDir: {}
  extraVolumeMounts:
    - name: data
      mountPath: /var/loki
