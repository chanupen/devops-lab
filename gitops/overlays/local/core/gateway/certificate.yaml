apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: lab-selfsigned
  namespace: envoy-gateway-system
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: lab-gateway
  namespace: envoy-gateway-system
spec:
  secretName: lab-gateway-tls
  dnsNames: # *.localtest.me resolves to 127.0.0.1 in public DNS
    - localtest.me
    - "*.localtest.me"
  issuerRef:
    kind: Issuer
    name: lab-selfsigned
