# Argo CD's UI through the lab Gateway: https://argocd.localtest.me:8443.
# argocd-server runs without TLS (server.insecure); the Gateway terminates it.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  parentRefs:
    - name: lab
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - argocd.localtest.me
  rules:
    - backendRefs:
        - name: argocd-server
          port: 80
