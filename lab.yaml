# Lab configuration. Read by `lab` from phase 1 onward.
mode: local          # local | cloud
profile: minimal     # minimal | standard | full
extraStacks: [obs]   # on top of the profile; minimal + obs is what the local provider runs today
gitops: argocd       # argocd | flux
k8sVersion: "1.36"   # the local lab; kind node image follows it. Must be in internal/compat (1.36 max: Argo CD 3.5)

repo:                # what Argo CD syncs from
  url: git@github.com:chanupen/devops-lab.git
  sshKeyFile: ~/.ssh/devops-lab-deploy   # read-only deploy key; loaded as a Secret, never committed

cloud:
  region: ap-south-1
  ttl: 2h             # lab up --mode cloud --ttl overrides; at most 8h, lab extend included
  owner: chanupen
  # k8sVersion: "1.36" # optional EKS pin; must be in standard support. Unset: the newest
  #                    # standard-support version Karpenter, the LBC and Argo CD all support
