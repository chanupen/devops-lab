name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BUILD_VERSION: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.ref_name }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - name: Validate release tag
        if: github.event_name == 'push'
        run: |
          [[ "$BUILD_VERSION" =~ ^v[A-Za-z0-9][A-Za-z0-9._-]*$ ]]
      - uses: golangci/golangci-lint-action@25e2cdc5eb1d7a04fdc45ff538f1a00e960ae128 # v8.0.0
        with:
          version: v2.15.0
          install-mode: goinstall
          skip-cache: true
      - name: Sign-off checks
        run: |
          make lint test
          python3 -m unittest discover -s .github/scripts -v
      - name: Build both release targets
        env:
          GOFLAGS: -trimpath
        run: |
          make build-all VERSION="$BUILD_VERSION"
          mkdir -p bin/release
          cp bin/lab-linux-amd64 bin/lab-darwin-amd64 LICENSE bin/release/
          python3 .github/scripts/third_party_notices.py \
            bin/release/lab-linux-amd64 bin/release/lab-darwin-amd64 \
            > bin/release/THIRD_PARTY_NOTICES.txt
          test "$(bin/release/lab-linux-amd64 version)" = "$BUILD_VERSION"
          file bin/release/lab-*
      - name: Write and verify checksums
        working-directory: bin/release
        run: |
          sha256sum lab-linux-amd64 lab-darwin-amd64 LICENSE THIRD_PARTY_NOTICES.txt > SHA256SUMS
          sha256sum --check SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lab-release
          path: bin/release/*
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a released commit from main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lab-release
          path: bin/release
      - name: Verify release payload
        working-directory: bin/release
        run: sha256sum --check SHA256SUMS
      - name: Publish GitHub release
        working-directory: bin/release
        run: |
          gh release create "$TAG_NAME" \
            lab-linux-amd64 lab-darwin-amd64 SHA256SUMS LICENSE THIRD_PARTY_NOTICES.txt \
            --verify-tag --generate-notes --draft
          gh release edit "$TAG_NAME" --draft=false
