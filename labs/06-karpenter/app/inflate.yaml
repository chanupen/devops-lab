# A workload that only takes room: each pod requests 700m CPU, so two fit
# on a 2-vCPU node and a third does not. It runs only on the lab's nodes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inflate
  namespace: lab06-karpenter
  labels:
    app: inflate
spec:
  replicas: 0
  selector:
    matchLabels:
      app: inflate
  template:
    metadata:
      labels:
        app: inflate
    spec:
      nodeSelector:
        karpenter.sh/nodepool: lab06
      tolerations:
        - key: lab.devops/lab
          operator: Equal
          value: 06-karpenter
          effect: NoSchedule
      terminationGracePeriodSeconds: 5
      securityContext:
        runAsNonRoot: true
        runAsUser: 65535
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10.1@sha256:278fb9dbcca9518083ad1e11276933a2e96f23de604a3a08cc3c80002767d24c
          resources:
            requests: {cpu: 700m, memory: 128Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
