# The database credentials, from Secrets Manager. ESO reads them through
# the ClusterSecretStore lab-secrets (Moto locally, AWS in cloud mode) and
# writes them into Kubernetes Secrets. It checks again every
# refreshInterval: an hour, a common production value.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-app
  namespace: lab04-app
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: lab-secrets}
  target: {name: db-app}
  data:
    - secretKey: username
      remoteRef: {key: lab04/db/app, property: username}
    - secretKey: password
      remoteRef: {key: lab04/db/app, property: password}
---
# Postgres's superuser. Postgres reads it once, at its first start.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-admin
  namespace: lab04-app
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: lab-secrets}
  target: {name: db-admin}
  data:
    - secretKey: username
      remoteRef: {key: lab04/db/admin, property: username}
    - secretKey: password
      remoteRef: {key: lab04/db/admin, property: password}
