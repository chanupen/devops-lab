# Steady traffic for the SLI: about 5 requests a second to podinfo-frontend.
apiVersion: v1
kind: Namespace
metadata:
  name: lab03-load
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: load
  namespace: lab03-load
  labels: {app: load}
spec:
  replicas: 1
  selector:
    matchLabels: {app: load}
  template:
    metadata:
      labels: {app: load}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: load
          image: docker.io/curlimages/curl:8.17.0@sha256:935d9100e9ba842cdb060de42472c7ca90cfe9a7c96e4dacb55e79e560b3ff40
          command: [sh, -c, 'while true; do curl -s -o /dev/null http://podinfo-frontend.podinfo:9898/; sleep 0.2; done']
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 10m, memory: 8Mi}
            limits: {memory: 32Mi}
