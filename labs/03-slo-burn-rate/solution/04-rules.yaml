# Step 3's rules plus the multiwindow, multi-burn-rate alerts.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: podinfo-slo
  namespace: lab03-slo
spec:
  groups:
    - name: lab03-sli
      rules:
        - record: lab03:sli_errors:ratio_rate2m
          expr: |
            (sum(rate(http_requests_total{namespace="podinfo",job="podinfo-frontend",status=~"5.."}[2m])) or vector(0))
            /
            sum(rate(http_requests_total{namespace="podinfo",job="podinfo-frontend"}[2m]))
        - record: lab03:sli_errors:ratio_rate10m
          expr: |
            (sum(rate(http_requests_total{namespace="podinfo",job="podinfo-frontend",status=~"5.."}[10m])) or vector(0))
            /
            sum(rate(http_requests_total{namespace="podinfo",job="podinfo-frontend"}[10m]))
        - record: lab03:sli_errors:ratio_rate1h
          expr: |
            (sum(rate(http_requests_total{namespace="podinfo",job="podinfo-frontend",status=~"5.."}[1h])) or vector(0))
            /
            sum(rate(http_requests_total{namespace="podinfo",job="podinfo-frontend"}[1h]))
        - record: lab03:sli_errors:ratio_rate12h
          expr: |
            (sum(rate(http_requests_total{namespace="podinfo",job="podinfo-frontend",status=~"5.."}[12h])) or vector(0))
            /
            sum(rate(http_requests_total{namespace="podinfo",job="podinfo-frontend"}[12h]))
    - name: lab03-slo
      rules:
        # The SLO: 99.5% of requests succeed over 30 days. Error budget 0.5%.
        - record: lab03:slo:objective_ratio
          expr: vector(0.995)
          labels: {slo_window: 30d}
        # Burn rate: how fast the budget goes. 1 spends it in exactly 30 days.
        - record: lab03:slo:burn_rate2m
          expr: lab03:sli_errors:ratio_rate2m / (1 - 0.995)
        - record: lab03:slo:burn_rate10m
          expr: lab03:sli_errors:ratio_rate10m / (1 - 0.995)
        - record: lab03:slo:burn_rate1h
          expr: lab03:sli_errors:ratio_rate1h / (1 - 0.995)
        - record: lab03:slo:burn_rate12h
          expr: lab03:sli_errors:ratio_rate12h / (1 - 0.995)
    - name: lab03-alerts
      rules:
        # Fast burn: 14.4x spends 2% of a 30-day budget in an hour (here: the
        # lab windows 10m and 2m). Pages.
        - alert: LabSLOFastBurn
          expr: lab03:slo:burn_rate10m > 14.4 and lab03:slo:burn_rate2m > 14.4
          labels: {severity: page}
          annotations:
            summary: podinfo-frontend burns its error budget 14.4 times too fast
        # Slow burn: 6x spends 5% in six hours (here: 1h and 10m). Pages too.
        - alert: LabSLOSlowBurn
          expr: lab03:slo:burn_rate1h > 6 and lab03:slo:burn_rate10m > 6
          labels: {severity: page}
          annotations:
            summary: podinfo-frontend burns its error budget 6 times too fast
        # Budget burn: 1x spends 10% in three days (here: 12h and 1h). A ticket:
        # someone looks at it in working hours.
        - alert: LabSLOBudgetTicket
          expr: lab03:slo:burn_rate12h > 1 and lab03:slo:burn_rate1h > 1
          labels: {severity: ticket}
          annotations:
            summary: podinfo-frontend spends its error budget faster than it earns it
