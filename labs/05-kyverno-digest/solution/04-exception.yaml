# One named workload may keep a tag-only image: Deployment legacy, the
# ReplicaSet it owns and that ReplicaSet's Pods. A PolicyException names the
# policy and matches with CEL; ownerReferences keep it to this workload, so
# a Pod that only copies its labels is still denied.
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: legacy-tag
  namespace: lab05-apps
spec:
  policyRefs:
    - name: require-image-digest
      kind: ValidatingPolicy
  matchConditions:
    # Deployment legacy, the ReplicaSet it owns, and that ReplicaSet's Pods.
    - name: legacy-and-its-children
      expression: >-
        (object.kind == 'Deployment' && object.metadata.name == 'legacy') ||
        (has(object.metadata.ownerReferences) && object.metadata.ownerReferences.exists(o,
          (o.kind == 'Deployment' && o.name == 'legacy') ||
          (o.kind == 'ReplicaSet' && o.name.startsWith('legacy-'))))
