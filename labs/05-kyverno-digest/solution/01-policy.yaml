# Enforce: a Pod in a lab05-* namespace must name every image by digest.
# Kyverno writes the same rule for Deployments, Jobs and the other Pod
# controllers itself (autogen), so a bad Deployment fails at once too.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-image-digest
  labels:
    lab.devops/lab: 05-kyverno-digest
  annotations:
    policies.kyverno.io/title: Require image digests
    policies.kyverno.io/description: Images must be pulled by digest, so what runs cannot change under a moved tag.
spec:
  background: true
  rules:
    - name: images-by-digest
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: ["lab05-*"]
      validate:
        failureAction: Enforce
        message: "Images must be pinned by digest (image@sha256:...): {{ request.object.metadata.name }} uses a tag only."
        pattern:
          spec:
            =(initContainers):
              - image: "*@sha256:*"
            containers:
              - image: "*@sha256:*"
