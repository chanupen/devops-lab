# kyverno test: the policy against two Pods, with the results we expect.
# It runs offline: no cluster.
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: require-image-digest
policies:
  - policy.yaml
resources:
  - resources.yaml
results:
  - policy: require-image-digest
    isValidatingPolicy: true
    kind: Pod
    resources: [tagged]
    result: fail
  - policy: require-image-digest
    isValidatingPolicy: true
    kind: Pod
    resources: [pinned]
    result: pass
