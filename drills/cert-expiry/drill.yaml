id: cert-expiry
title: A certificate that cannot renew
level: intermediate
stacks: [sample-db, obs]
timeLimit: 30m
# Added by the drills to the obs stack (lab-drills rules), from
# cert-manager's certificate metrics.
alert:
  name: CertificateExpiringSoon
  labels: {namespace: sample-db, name: sample-db-tls}
hints:
  - "Start from the alert: kubectl -n sample-db get certificate,certificaterequest. Which certificate is past its renewal time, and when does it expire (kubectl -n sample-db describe certificate sample-db-tls)?"
  - "A renewal is a CertificateRequest. Is the newest one issued, pending or failed, and why? Follow its issuerRef: kubectl -n sample-db describe issuer. cmctl explains it in one go: podman run --rm --network host -v \"$KUBECONFIG\":/kc:ro,Z -e KUBECONFIG=/kc quay.io/jetstack/cmctl:v2.6.1@sha256:e5b5f53fede34dc1da14b9d1dac4c01f7a6030704f4fe362b7b486304976b1b6 status certificate -n sample-db sample-db-tls"
  - "Nothing in Git changed, yet the Issuer's spec did. Who changed it? argocd app history sample-db (argocd --core, or the UI) lists every release with its Helm parameters."
  - "Undo the release that broke it through Argo CD (argocd app set sample-db --sync-policy none, then argocd app rollback sample-db <id>; or argocd app unset -p for the parameter), not with kubectl: self-heal would put it back. The pending renewal then goes through on its own."
cause: issuer-ca-secret
causes:
  issuer-ca-secret: A release pointed the CA Issuer at a CA Secret that does not exist
  cert-manager-down: cert-manager is not running
  short-lifetime: The certificate's lifetime is shorter than cert-manager allows
  dns-validation: An ACME DNS challenge fails
  clock-skew: The nodes' clocks are wrong
spoilers: [Issuer, issuer, caSecretName, ca-2026, "CA Secret"]
touches: [sample-db, argocd]
snapshot:
  - {apiVersion: argoproj.io/v1alpha1, resource: applications, namespace: argocd, name: lab-bootstrap}
  - {apiVersion: argoproj.io/v1alpha1, resource: applications, namespace: argocd, name: sample-db}
