id: bad-deploy
title: A release that crashes on start
level: beginner
stacks: [sample-app, obs]
timeLimit: 30m
# kube-prometheus-stack's rule; the obs stack sets its "for" to 5m (upstream: 15m).
alert:
  name: KubePodCrashLooping
  labels: {namespace: podinfo}
hints:
  - "Start where users are: which pods in the podinfo namespace are not Ready? kubectl -n podinfo get pods"
  - "kubectl -n podinfo describe pod and kubectl -n podinfo logs --previous show why the container exits, and which image it runs."
  - "Nothing in Git changed. Who deployed that image? argocd app history podinfo-frontend (argocd --core, or the UI at https://argocd.localtest.me:8443) lists every release."
  - "Argo CD refuses to roll back while auto-sync is on: argocd app set podinfo-frontend --sync-policy none, then argocd app rollback podinfo-frontend <id of the last good release>."
touches: [podinfo, argocd]
snapshot:
  - {apiVersion: argoproj.io/v1alpha1, resource: applications, namespace: argocd, name: lab-bootstrap}
  - {apiVersion: argoproj.io/v1alpha1, resource: applications, namespace: argocd, name: podinfo-frontend}
